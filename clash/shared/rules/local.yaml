# 仅匹配条件，不携带策略；共同规则先于上游服务分类。
private:
  - DOMAIN-SUFFIX,localhost
  - DOMAIN-SUFFIX,local
  - DOMAIN-SUFFIX,lan
  - IP-CIDR,0.0.0.0/8
  - IP-CIDR,10.0.0.0/8
  - IP-CIDR,127.0.0.0/8
  - IP-CIDR,169.254.0.0/16
  - IP-CIDR,172.16.0.0/12
  - IP-CIDR,192.168.0.0/16
  - IP-CIDR,100.64.0.0/10
  - IP-CIDR,224.0.0.0/4
  - IP-CIDR6,::1/128
  - IP-CIDR6,fc00::/7
  - IP-CIDR6,fe80::/10
# 用户自己的例外放这里；保持空数组表示不覆写上游。
direct: []
proxy: []
