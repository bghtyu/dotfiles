# 客户端无关：只在这里维护组名与选项。
regions:
  - {name: 新加坡, filter: '(?i)新加坡|狮城|singapore|\bsg\b|🇸🇬'}
  - {name: 日本, filter: '(?i)日本|东京|大阪|japan|\bjp\b|🇯🇵'}
  - {name: 台湾, filter: '(?i)台湾|台灣|taiwan|\btw\b|🇹🇼'}
  - {name: 美国, filter: '(?i)美国|美國|洛杉矶|圣何塞|united states|\bus\b|🇺🇸'}
  - {name: 香港, filter: '(?i)香港|hong kong|hongkong|\bhk\b|🇭🇰'}
automatic:
  interval: 600
  tolerance: 50
  url: https://www.gstatic.com/generate_204
  lazy: true
service_options: [全球加速, 直连, 新加坡, 日本, 台湾, 美国, 香港]
global_options: [新加坡, 日本, 台湾, 美国, 香港, 直连, 自动选择, 手动选择]
services:
  - {name: 微信, default: 直连}
  - {name: 哔哩哔哩, default: 直连}
  - {name: 加密货币, default: 全球加速}
  - {name: GitHub, default: 全球加速}
  - {name: AI 服务, default: 全球加速}
  - {name: Google, default: 全球加速}
  - {name: YouTube, default: 全球加速}
  - {name: 苹果服务, default: 直连}
  - {name: Telegram, default: 全球加速}
  - {name: Microsoft, default: 全球加速}
  - {name: 声田音乐, default: 全球加速}
  - {name: 国际媒体, default: 全球加速}
  - {name: 游戏服务, default: 全球加速}
  - {name: 国内服务, default: 直连}
  - {name: 兜底分流, default: 全球加速}
