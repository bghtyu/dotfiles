mode: rule
log-level: info
ipv6: false
allow-lan: false
bind-address: 127.0.0.1
mixed-port: 7890
tun:
  enable: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver: &id001
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver: *id001
  nameserver-policy:
    rule-set:proxy-dns:
    - https://1.1.1.1/dns-query#自动选择
    dns.alidns.com: *id001
    doh.pub: *id001
    raw.githubusercontent.com: *id001
    subscription-a.example.invalid: *id001
    subscription-b.example.invalid: *id001
    +.local:
    - system
    +.lan:
    - system
    +.localhost:
    - system
    +.10.in-addr.arpa:
    - system
    +.168.192.in-addr.arpa:
    - system
    +.254.169.in-addr.arpa:
    - system
    +.16.172.in-addr.arpa:
    - system
    +.17.172.in-addr.arpa:
    - system
    +.18.172.in-addr.arpa:
    - system
    +.19.172.in-addr.arpa:
    - system
    +.20.172.in-addr.arpa:
    - system
    +.21.172.in-addr.arpa:
    - system
    +.22.172.in-addr.arpa:
    - system
    +.23.172.in-addr.arpa:
    - system
    +.24.172.in-addr.arpa:
    - system
    +.25.172.in-addr.arpa:
    - system
    +.26.172.in-addr.arpa:
    - system
    +.27.172.in-addr.arpa:
    - system
    +.28.172.in-addr.arpa:
    - system
    +.29.172.in-addr.arpa:
    - system
    +.30.172.in-addr.arpa:
    - system
    +.31.172.in-addr.arpa:
    - system
profile:
  store-selected: true
proxy-providers:
  订阅一:
    url: https://subscription-a.example.invalid/proxies.yaml
    interval: 86400
    type: http
    path: ./proxy-providers/provider-1.yaml
    health-check:
      enable: true
      url: https://1.1.1.1/cdn-cgi/trace
      interval: 600
      lazy: true
  订阅二:
    url: https://subscription-b.example.invalid/proxies.yaml
    interval: 86400
    type: http
    path: ./proxy-providers/provider-2.yaml
    health-check:
      enable: true
      url: https://1.1.1.1/cdn-cgi/trace
      interval: 600
      lazy: true
proxy-groups:
- name: 直连
  type: select
  proxies:
  - DIRECT
- name: 全球加速
  type: select
  proxies:
  - 新加坡
  - 日本
  - 台湾
  - 美国
  - 香港
  - 直连
  - 自动选择
  - 手动选择
- name: 新加坡
  type: url-test
  proxies: []
  use:
  - 订阅一
  - 订阅二
  filter: (?i)新加坡|狮城|singapore|\bsg\b|🇸🇬
  interval: 600
  tolerance: 50
  lazy: true
  url: https://1.1.1.1/cdn-cgi/trace
- name: 日本
  type: url-test
  proxies: []
  use:
  - 订阅一
  - 订阅二
  filter: (?i)日本|东京|大阪|japan|\bjp\b|🇯🇵
  interval: 600
  tolerance: 50
  lazy: true
  url: https://1.1.1.1/cdn-cgi/trace
- name: 台湾
  type: url-test
  proxies: []
  use:
  - 订阅一
  - 订阅二
  filter: (?i)台湾|台灣|taiwan|\btw\b|🇹🇼
  interval: 600
  tolerance: 50
  lazy: true
  url: https://1.1.1.1/cdn-cgi/trace
- name: 美国
  type: url-test
  proxies: []
  use:
  - 订阅一
  - 订阅二
  filter: (?i)美国|美國|洛杉矶|圣何塞|united states|\bus\b|🇺🇸
